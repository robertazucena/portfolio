<!DOCTYPE html>
<html lang="fil">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kahera — Store system for sari-sari stores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<meta name="description" content="Kahera: sell, give sukli, restock and see your sales. A simple store system for sari-sari stores in the Philippines.">
<meta name="theme-color" content="#4A60E0">
</head>
<body>
<div id="app"></div>
<div id="pre" role="status" aria-live="polite" aria-label="Loading Kahera">
  <div class="pre-in">
    <div class="pre-mark">
      <span class="pre-ring"></span>
      <svg class="pre-logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7389F4"/><stop offset="1" stop-color="#3A4BCB"/></linearGradient><clipPath id="pc"><rect width="32" height="32" rx="9"/></clipPath></defs>
        <rect width="32" height="32" rx="9" fill="url(#pg)"/>
        <g clip-path="url(#pc)"><rect class="pre-shine" x="-20" y="-8" width="10" height="48" fill="#fff" opacity=".28" transform="rotate(20 16 16)"/></g>
        <path class="pre-k" pathLength="1" d="M12.1 8.4v15.2M21.7 8.8l-7.3 7 7.5 7.3" fill="none" stroke="#fff" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="pre-b b1" d="M8.1 11.6h6.4" stroke="#FFC76B" stroke-width="2.2" stroke-linecap="round"/>
        <path class="pre-b b2" d="M8.1 15.1h6.4" stroke="#FFC76B" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <span class="pre-coin c1">₱</span><span class="pre-coin c2">₱</span><span class="pre-coin c3">₱</span>
    </div>
    <div class="pre-word" aria-hidden="true"><span>K</span><span>a</span><span>h</span><span>e</span><span>r</span><span>a</span></div>
    <div class="pre-tape" aria-hidden="true"><i></i><b></b></div>
    <div class="pre-msg" aria-hidden="true"><span></span><span></span><span></span></div>
  </div>
</div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="script.js"></script>
</body>
</html>
