  <link rel="stylesheet" href="styles.css" />
  <style id="oeg-loader-css">
    .oeg-loader{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:#F8FAFC;font-family:"Inter","Helvetica Neue",-apple-system,sans-serif;transition:opacity .42s cubic-bezier(.23,1,.32,1),visibility 0s linear .42s}
    .oeg-loader:before{content:"";position:absolute;inset:-10%;background:radial-gradient(520px 420px at 30% 30%,#e9e3ff,transparent 70%),radial-gradient(520px 420px at 72% 70%,#ffe7df,transparent 70%);filter:blur(30px);opacity:.9}
    .oeg-loader.is-out{opacity:0;visibility:hidden}
    .oeg-loader-stage{position:relative;display:grid;justify-items:center;gap:22px;transition:transform .42s cubic-bezier(.23,1,.32,1)}
    .oeg-loader.is-out .oeg-loader-stage{transform:translateY(-10px) scale(.98)}
    .oeg-mini{width:232px;padding:14px;background:#fff;border:1px solid #E5E7EB;border-radius:14px;box-shadow:0 2px 4px rgba(49,45,42,.04),0 24px 48px -18px rgba(49,45,42,.22);display:grid;gap:9px}
    .oeg-mini-top{display:flex;align-items:center;gap:9px}
    .oeg-mini-top svg{width:22px;height:22px;border-radius:5px;flex:none}
    .oeg-mini i{display:block;height:7px;border-radius:4px;background:#ECEEF1;transform-origin:left center;transform:scaleX(0);animation:oeg-grow .5s cubic-bezier(.23,1,.32,1) forwards}
    .oeg-mini .m-hero{height:82px;border-radius:8px;background:linear-gradient(120deg,#ffd9cf,#efe6ff 55%,#dfe9ff);animation-delay:.28s}
    .oeg-mini .m-subj{flex:1;height:8px;background:#312D2A;opacity:.85;animation-delay:.12s}
    .oeg-mini .m-l1{width:92%;animation-delay:.46s}.oeg-mini .m-l2{width:78%;animation-delay:.56s}.oeg-mini .m-l3{width:56%;animation-delay:.66s}
    .oeg-mini .m-cta{width:74px;height:18px;border-radius:5px;background:#FF5A3C;margin-top:3px;animation-delay:.84s}
    .oeg-mark{opacity:0;transform:scale(.9);animation:oeg-pop .45s cubic-bezier(.23,1,.32,1) forwards}
    .oeg-loader-label{display:grid;justify-items:center;gap:10px;font-size:13px;font-weight:600;color:#4b4f56;letter-spacing:-.005em}
    .oeg-bar{width:132px;height:3px;border-radius:3px;background:#E9EBEF;overflow:hidden}
    .oeg-bar b{display:block;height:100%;width:100%;background:#C74634;transform-origin:left center;transform:scaleX(0);animation:oeg-grow 1.3s cubic-bezier(.65,0,.35,1) forwards}
    @keyframes oeg-grow{to{transform:scaleX(1)}}
    @keyframes oeg-pop{to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.oeg-mini i,.oeg-mark,.oeg-bar b{animation:none;transform:none;opacity:1}.oeg-loader-stage{transition:none}}
  </style>
  <script>
    (function () {
      var framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
      var q = [], done = false;
      window.OEGWhenReady = function (cb) { done ? cb() : q.push(cb); };
      function release() { if (done) return; done = true; q.splice(0).forEach(function (cb) { cb(); }); }
      if (framed) { document.documentElement.classList.add("no-loader"); done = true; return; }
      var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      var t0 = Date.now(), MIN = reduced ? 300 : 1400, MAX = 3500;
      function hide() {
        var el = document.getElementById("oegLoader");
        if (!el || el.classList.contains("is-out")) return;
        el.classList.add("is-out");
        release();
        setTimeout(function () { el.remove(); }, 480);
      }
      window.addEventListener("load", function () { setTimeout(hide, Math.max(0, MIN - (Date.now() - t0))); });
      setTimeout(hide, MAX);
    })();
  </script>
  <style>.no-loader .oeg-loader{display:none}</style>
</head>
